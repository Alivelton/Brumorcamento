name: Build Brum Orçamentos (iOS IPA)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compilar IPA no macOS
    runs-on: macos-14

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Versão do Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Instalar xtool via Homebrew
        run: brew install xtool-org/tap/xtool

      - name: Compilar App e Gerar IPA
        run: |
          xtool dev build --configuration release --ipa

      - name: Publicar IPA como Artefato para Download
        uses: actions/upload-artifact@v4
        with:
          name: BrumOrcamento-iOS-Release
          path: |
            .xtool/build/*.ipa
            .build/*.ipa
            **/*.ipa
          if-no-files-found: error
